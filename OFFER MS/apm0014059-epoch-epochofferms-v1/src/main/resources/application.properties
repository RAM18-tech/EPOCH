redis.cluster.ssl-enabled=false
redis.cluster.writelockduration=0
#Maximum number of redirects to follow when executing commands across the cluster
redis.cluster.max-redirects=2
#Default TTL expiration
redis.cluster.default-time-to-live=900
#Total number of connections by client
redis.cluster.jedis-pool-max-active=20
# Max Total idle connections that can be present
redis.cluster.jedis-pool-max-idle=20
#Min Total idle connections that can be present
redis.cluster.jedis-pool-min-idle=10
#How long to wait if calling JedisPool.getResource
redis.cluster.jedis-pool-max-wait=20  
# wait time for getting a connection 
redis.cluster.connection-timeout=5000
# Socket Timeout a.k.a operation timeout
redis.cluster.readtimeout=5000
#redis.cluster.connectionfactory-delay=10
#exception Mapping list
redis.cluster.auth-exception-mappings.CacheRedis=redis_map_1
#connectionfactory max retry attempts
redis.cluster.connectionfactory-max-retry-attempts=3
#connectionfactory delay 
redis.cluster.connectionfactory-delay=10
#key logging enablement during serialization 
redis.cluster.serializer-key-logging=true
#key logging enablement during de-serialization
redis.cluster.deserializer-key-logging=true
#value logging enablement during serialization
redis.cluster.serializer-value-logging=true
#value logging enablement during de-serialization
redis.cluster.deserializer-value-logging=true
# retry for the cache operation
redis.cluster.cache-operation-retry=2
# retry for the cache operation retry delay
redis.cluster.cache-operation-delay=20

