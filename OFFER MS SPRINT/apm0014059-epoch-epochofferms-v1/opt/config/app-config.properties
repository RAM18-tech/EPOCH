# Enable Ingress for Multi-cluster design                 #
#---------------------------------------------------------#
dcp-config.ingress-enable-multi-cluster="TRUE"

#---------------------------------------------------------#
# Enable Ingress for Multi-Namespace design               #
#---------------------------------------------------------#
dcp-config.ingress-enable-multi-namespace=TRUE
#---------------------------------------------------------#
# Enable HPA for app specific changes                     #
#---------------------------------------------------------#
dcp-config.enable.app.hpa=TRUE

