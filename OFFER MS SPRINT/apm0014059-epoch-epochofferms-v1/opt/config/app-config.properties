spring.redis.pool.max-active=20 # Max number of connections that can be allocated by the pool at a given time. Use a negative value for no limit.
spring.redis.pool.max-idle=20 # Max number of "idle" connections in the pool. Use a negative value to indicate an unlimited number of idle connections.
spring.redis.pool.max-wait=-1 # Maximum amount of time (in milliseconds) a connection allocation should block before throwing an exception when the pool is exhausted. Use a negative value to block indefinitely.
spring.redis.pool.min-idle=20 # Target for the minimum number of idle connections to maintain in the pool. This setting only has an effect if it is positive.

#Remove RedisAutoConfiguration entry from below if you are making use of Redis cache, also remove the same from exclusion list of @EnableAutoConfiguration in Application.java
