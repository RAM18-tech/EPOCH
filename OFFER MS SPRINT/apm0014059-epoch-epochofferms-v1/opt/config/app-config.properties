# Properties file to feed configurable Node properties #

#-----------------------------------------------------------#
# Kubernetes resources                                      #
# Default values - Can be Overriden from env specific jsons #
# Add values in ./config/env-config.json under respective   #
# cluster node, read and set as ENV vars in Jenkinsfile     #
#-----------------------------------------------------------#
# App ports
dcp-config.app.service.port=8080
dcp-config.app.target.port=8080
dcp-config.app.container.port=8080
# App pod resources limits
dcp-config.app.resources.limits.cpu=
dcp-config.app.resources.limits.mem=
dcp-config.app.resources.limits.ephemeral=500Mi
# App pod resources requests
dcp-config.app.resources.requests.cpu=
dcp-config.app.resources.requests.mem=
dcp-config.app.resources.requests.ephemeral=250Mi
# HPA
dcp-config.hpa.min.replicas=
dcp-config.hpa.max.replicas=
dcp-config.target.cpu.utilization.percentage=70
# Kubernetes health-check Configurations
dcp-config.post-deploy.k8s-health-check.uri=/actuator/health
dcp-config.post-deploy.k8s-rollout-status.timeout.mins=15
# Secret store Management
dcp-config.secret.store.enabled="TRUE"

#---------------------------------------------------------#
# SAST configurations                                     #
#---------------------------------------------------------#
dcp-config.sast-scan.credential-id=
dcp-config.sast-scan.app-name=
dcp-config.sast-scan.teams=
dcp-config.sast-scan.app-timeout=60
dcp-config.sast-scan.wait-for-scan=false

#---------------------------------------------------------#
# SCA configurations                                      #
#---------------------------------------------------------#
dcp-config.sca-scan.credential-id=

#-----------------------------------------------------#
# Ingress default Configuration                       #
#-----------------------------------------------------#
dcp-config.ingress.rewrite.target=/epochofferms/$2
dcp-config.ingress.rewrite.path=epochofferms

#dcp-config.ingress.nginx.canary.weight=100

dcp-config.ingress.nginx.canary.key=dcp-canary
