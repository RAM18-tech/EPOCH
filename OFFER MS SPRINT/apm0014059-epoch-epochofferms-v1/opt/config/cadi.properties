aaf_id=m12679@idp.att.com
#NOTE: This Pre-Prod MechID=12679 Cadi1.4.2 password will expire April, 2021. Regenerate/Redeploy prior to then.
aaf_password=enc:R3WR1p9mQNiBuuyJmiVWjJX8_ZE5jsvXr_XDOWd-d0D

# local and CI Builds: uncomment (use). Not in QA/Prod builds.
