apiVersion: {{ .Values.hpa_api_version | default "autoscaling/v2" }}
kind: HorizontalPodAutoscaler
metadata:
  {{- if or (eq .Values.deployment_strategy "blue-green") (eq .Values.deployment_strategy "canary") }}
  name: {{ .Values.appname }}-{{ .Values.target_role }}
  {{- else }}
  name: {{ .Values.appname }}
  {{- end }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    {{- if or (eq .Values.deployment_strategy "blue-green") (eq .Values.deployment_strategy "canary") }}
    name: {{ .Values.appname }}-{{ .Values.target_role }}
    {{- else }}
    name: {{ .Values.appname }}
    {{- end }}
  minReplicas: {{ .Values.hpa_min_replicas }}
  maxReplicas: {{ .Values.hpa_max_replicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 40
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 3599
      policies:
      - type: Percent
        value: 10
        periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
      - type: Pods
        value: 5
        periodSeconds: 30
      selectPolicy: Max
